[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-assistant"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
    "pandas",
    "anthropic",
]

[project.scripts]
lol-assistant = "lol_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["lol_assistant*"]
